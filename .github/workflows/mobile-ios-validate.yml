name: Mobile — iOS validate

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios-validate.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#090511' --iconBackgroundColorDark '#090511' --splashBackgroundColor '#090511' --splashBackgroundColorDark '#090511'
      - run: npx cap sync ios
      # Capacitor 8 usa Swift Package Manager: non esiste App.xcworkspace, solo App.xcodeproj.
      - name: Validate iOS simulator build
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
