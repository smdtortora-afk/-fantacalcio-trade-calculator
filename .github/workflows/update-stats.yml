name: Auto update player stats

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'players.js'
      - 'scripts/update_stats.py'
      - 'data/player-mappings.json'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: fantascam-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update player statistics
        id: sync
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_stats.py

      - name: Publish snapshot and synchronization status
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          test -f data/stats.json
          git add data/stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "trade-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Fantascam statistics and sync status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report provider failure
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo "::error::Aggiornamento fallito. Ultimi dati validi conservati; dettagli in data/stats.json."
          exit 1
