name: Auto update player stats

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update player statistics
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SERIE_A_SEASON: '2026'
        run: python scripts/update_stats.py

      - name: Commit changes if any
        run: |
          if git diff --quiet players.js; then
            echo "No player changes"
            exit 0
          fi
          git config user.name "trade-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add players.js
          git commit -m "Auto-update player stats"
          git push
